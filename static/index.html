<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crate Digger">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Crate Digger</title>
<style>
:root {
  --bg: #f2f2f7; --cell: #ffffff; --cell-press: #e5e5ea; --label: #000000;
  --label2: rgba(60, 60, 67, .6); --label3: rgba(60, 60, 67, .3); --sep: rgba(60, 60, 67, .2);
  --fill: rgba(118, 118, 128, .12); --fill2: rgba(118, 118, 128, .2); --seg-on: #ffffff;
  --tint: #fa2d48; --tint-soft: rgba(250, 45, 72, .12);
  --green: #34c759; --orange: #ff9500; --blue: #007aff; --gray: #8e8e93;
  --bar: rgba(242, 242, 247, .82); --shadow: 0 10px 30px rgba(0, 0, 0, .18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --cell: #1c1c1e; --cell-press: #2c2c2e; --label: #ffffff;
    --label2: rgba(235, 235, 245, .6); --label3: rgba(235, 235, 245, .3); --sep: rgba(84, 84, 88, .55);
    --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .32); --seg-on: #636366;
    --tint: #fc3c5a; --tint-soft: rgba(252, 60, 90, .18);
    --green: #30d158; --orange: #ff9f0a; --blue: #0a84ff; --gray: #8e8e93;
    --bar: rgba(0, 0, 0, .78); --shadow: 0 10px 30px rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --cell: #1c1c1e; --cell-press: #2c2c2e; --label: #ffffff;
  --label2: rgba(235, 235, 245, .6); --label3: rgba(235, 235, 245, .3); --sep: rgba(84, 84, 88, .55);
  --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .32); --seg-on: #636366;
  --tint: #fc3c5a; --tint-soft: rgba(252, 60, 90, .18);
  --green: #30d158; --orange: #ff9f0a; --blue: #0a84ff; --gray: #8e8e93;
  --bar: rgba(0, 0, 0, .78); --shadow: 0 10px 30px rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--label); }
body { font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; letter-spacing: -.01em;
       -webkit-font-smoothing: antialiased; min-height: 100vh; }
.page { max-width: 600px; margin: 0 auto; padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }
a { color: var(--tint); text-decoration: none; }
svg.i { width: 1em; height: 1em; fill: currentColor; flex: none; }
.hidden { display: none !important; }

/* navigation bar */
.bar { position: sticky; top: 0; z-index: 10; padding-top: env(safe-area-inset-top);
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid transparent; transition: border-color .2s; }
.bar.scrolled { border-bottom-color: var(--sep); }
.bar-in { max-width: 600px; margin: 0 auto; height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; }
.bar-title { font-weight: 600; font-size: 17px; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.bar.scrolled .bar-title { opacity: 1; }
.bar-btn { background: none; border: 0; color: var(--tint); font: inherit; font-size: 17px; padding: 8px; display: inline-flex; align-items: center; gap: 2px; cursor: pointer; }
.bar-btn:active { opacity: .4; }
.bar-btn .i { width: 22px; height: 22px; }
.bar-right { justify-self: end; }
.large-title { font-size: 34px; font-weight: 700; letter-spacing: .01em; margin: 4px 0 14px; }

/* segmented control */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; margin: 0 0 16px; }
.seg button { border: 0; background: none; color: var(--label); font: inherit; font-size: 13px; font-weight: 500; padding: 7px 4px;
  border-radius: 7px; cursor: pointer; transition: background .2s; }
.seg button[aria-selected="true"] { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }

/* grouped lists */
.group { background: var(--cell); border-radius: 12px; overflow: hidden; margin: 0 0 24px; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 44px; position: relative; width: 100%;
  background: none; border: 0; color: inherit; font: inherit; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); border-top: .5px solid var(--sep); }
button.row, a.row { cursor: pointer; color: inherit; }
button.row:active, a.row:active { background: var(--cell-press); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t.wrap { white-space: normal; }
.row .s { font-size: 15px; color: var(--label2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s.wrap { white-space: normal; }
.chev { color: var(--label3); width: 9px !important; height: 14px !important; }
.art { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: var(--fill); flex: none; }
.art.lg { width: 56px; height: 56px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 8px; padding: 0 4px; }
.section-h h2 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: .01em; }
.section-h button { background: none; border: 0; color: var(--tint); font: inherit; font-size: 15px; cursor: pointer; }
.footnote { font-size: 13px; color: var(--label2); padding: 0 16px; margin: -16px 0 24px; }

/* inputs */
.field { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 44px; }
.field + .field { border-top: .5px solid var(--sep); }
.field label { width: 64px; flex: none; font-size: 17px; }
.field input { flex: 1; min-width: 0; border: 0; background: none; color: var(--label); font: inherit; font-size: 17px; padding: 11px 0; outline: none; }
.field input::placeholder { color: var(--label3); }
.search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; padding: 0 8px; height: 36px; margin: 0 0 12px; color: var(--label2); }
.search input { flex: 1; min-width: 0; border: 0; background: none; color: var(--label); font: inherit; font-size: 17px; outline: none; }
.search input::placeholder { color: var(--label2); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border: 0; border-radius: 12px;
  background: var(--tint); color: #fff; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; margin: 0 0 12px; }
.btn:active { opacity: .7; }
.btn.tinted { background: var(--tint-soft); color: var(--tint); }
.btn .i { width: 20px; height: 20px; }
.hint { font-size: 13px; color: var(--label2); text-align: center; margin: -4px 0 20px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--fill); color: var(--label2); }
.pill.green { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.pill.blue { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
.pill.tint { background: var(--tint-soft); color: var(--tint); }
.banner { font-size: 15px; background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--label); border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; }
.textbtn { background: none; border: 0; color: var(--tint); font: inherit; font-size: 17px; padding: 0 0 0 12px; cursor: pointer; }
.decide { display: flex; gap: 8px; margin: 0 0 16px; }
.decide > .dbtn { flex: 1 1 0; min-width: 0; }
.dbtn { height: 50px; border: 0; border-radius: 12px; background: var(--fill); color: var(--label); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
.dbtn:active { opacity: .6; }
.dbtn:disabled { opacity: .4; }
.dbtn.buy { background: var(--green); color: #fff; }
.dbtn.explore { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
.dbtn.want { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }

/* record header */
.hero { text-align: center; padding: 8px 0 20px; }
.hero img, .hero .ph { width: min(260px, 70vw); aspect-ratio: 1; border-radius: 10px; object-fit: cover; box-shadow: var(--shadow); background: var(--fill); display: block; margin: 0 auto 18px; }
.hero h1 { font-size: 22px; font-weight: 700; margin: 0 0 2px; letter-spacing: .005em; }
.hero .artist { font-size: 20px; color: var(--tint); margin: 0 0 6px; }
.hero .meta { font-size: 13px; color: var(--label2); margin: 0; text-transform: uppercase; letter-spacing: .02em; font-weight: 500; }
.hero .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }

/* status icons */
.ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: none; }
.ico .i { width: 18px; height: 18px; }
.ico.tint { background: var(--tint); } .ico.orange { background: var(--orange); } .ico.blue { background: var(--blue); } .ico.gray { background: var(--gray); } .ico.green { background: var(--green); }

/* tracks */
.num { width: 22px; text-align: center; color: var(--label2); font-size: 15px; font-variant-numeric: tabular-nums; flex: none; }
.play { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--fill); color: var(--tint); display: grid; place-items: center; cursor: pointer; flex: none; }
.play .i { width: 14px; height: 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 4px; margin: -12px 0 24px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; background: var(--cell); color: var(--tint); font-size: 15px; font-weight: 600; border-radius: 999px; padding: 8px 14px; }
.chip .i { width: 15px; height: 15px; }

/* price */
.price { padding: 14px 16px 4px; }
.price b { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.price small { display: block; font-size: 13px; color: var(--label2); margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); padding: 12px 0 14px; }
.stats div { text-align: center; }
.stats div + div { border-left: .5px solid var(--sep); }
.stats b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats small { font-size: 12px; color: var(--label2); }
.sentence { font-size: 15px; color: var(--label2); padding: 12px 16px; border-bottom: .5px solid var(--sep); }
.attrib { font-size: 12px; color: var(--label2); text-align: center; margin: 0 0 8px; }

/* live barcode scanner */
.scanner { position: fixed; inset: 0; z-index: 50; background: #000; color: #fff; animation: in .2s ease-out; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-frame { position: absolute; left: 50%; top: 42%; width: min(82vw, 360px); height: min(44vw, 190px); transform: translate(-50%, -50%);
  border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .55); border: 2px solid rgba(255, 255, 255, .9); overflow: hidden; }
.scan-frame::after { content: ""; position: absolute; left: 8%; right: 8%; height: 2px; top: 50%; background: var(--tint); box-shadow: 0 0 12px var(--tint);
  animation: sweep 1.8s ease-in-out infinite alternate; }
@keyframes sweep { from { top: 18%; } to { top: 82%; } }
.scan-top { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; display: flex; justify-content: space-between; align-items: center; }
.scan-top button, .scan-bottom button { background: rgba(60, 60, 67, .55); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border: 0; color: #fff; font: inherit; font-size: 17px; font-weight: 600; border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.scan-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 24px); text-align: center; }
.scan-bottom p { margin: 0 0 16px; font-size: 17px; font-weight: 600; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }
@media (prefers-reduced-motion: reduce) { .scan-frame::after { animation: none; } }

/* loading */
.skel { background: var(--fill); border-radius: 5px; height: 12px; margin: 5px 0; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.spinner { width: 20px; height: 20px; flex: none; animation: spin 1s steps(8) infinite; color: var(--label2); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .skel, .spinner { animation: none; } }
.view { animation: in .25s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
<nav class="bar" id="bar">
  <div class="bar-in">
    <div><button class="bar-btn hidden" id="back"><svg class="i" viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Search</button></div>
    <div class="bar-title" id="bartitle">Crate Digger</div>
    <div class="bar-right"><button class="bar-btn" id="refresh" aria-label="Re-import collection and library"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  </div>
</nav>
<main class="page" id="app"></main>
<div class="scanner hidden" id="scanner" role="dialog" aria-label="Scan barcode">
  <video id="scanvideo" playsinline muted autoplay></video>
  <div class="scan-frame" aria-hidden="true"></div>
  <div class="scan-top"><button id="scancancel">Cancel</button></div>
  <div class="scan-bottom"><p id="scanstatus">Point the camera at the barcode</p><button id="scanphoto">Take a Photo Instead</button></div>
</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js" defer></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app'), bar = $('#bar');
const api = async (path, opts) => { const r = await fetch(path, opts); const d = await r.json(); if (!r.ok) throw new Error(d.error || r.status); return d; };
// A response may render only into the view that started it, even after returning to the same URL.
let viewVersion = 0;
function viewGuard() {
  const version = viewVersion, hash = location.hash;
  return () => version === viewVersion && hash === location.hash;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const I = {
  chev: '<svg class="i chev" viewBox="0 0 9 14"><path d="M1.5 1.5 7 7l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  camera: '<svg class="i" viewBox="0 0 24 24"><path d="M9 4h6l1.6 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.4L9 4Zm3 4.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>',
  play: '<svg class="i" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z"/></svg>',
  pause: '<svg class="i" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  stack: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="2.5"/><path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V17" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  note: '<svg class="i" viewBox="0 0 24 24"><path d="M19 3v12.5a3.5 3.5 0 1 1-2-3.16V7.4L9 9.1v8.4a3.5 3.5 0 1 1-2-3.16V5.5L19 3Z"/></svg>',
  disc: '<svg class="i" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 7.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>',
  minus: '<svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.8" width="14" height="2.4" rx="1.2"/></svg>',
  ext: '<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  spinner: '<svg class="spinner" viewBox="0 0 24 24">' + Array.from({length: 8}, (_, i) =>
    `<rect x="11" y="2" width="2" height="6" rx="1" fill="currentColor" opacity="${(i + 1) / 8}" transform="rotate(${i * 45} 12 12)"/>`).join('') + '</svg>',
};

// ---------------------------------------------------------------- recent records (this phone only)
const RECENT = 'cd.recent';
const recent = () => { try { return JSON.parse(localStorage.getItem(RECENT)) || []; } catch (e) { return []; } };
const remember = r => {
  const item = {id: r.id, artist: r.artist, title: r.title, year: r.year, format: r.format, image: r.image};
  try { localStorage.setItem(RECENT, JSON.stringify([item, ...recent().filter(x => x.id !== r.id)].slice(0, 5))); } catch (e) {}
};

// ---------------------------------------------------------------- chrome
function chrome(title, back) {
  $('#bartitle').textContent = title;
  $('#back').classList.toggle('hidden', !back);
  $('#refresh').classList.toggle('hidden', back);
  onScroll();
}
function onScroll() { bar.classList.toggle('scrolled', window.scrollY > 30); }
window.addEventListener('scroll', onScroll, {passive: true});
$('#back').onclick = () => history.length > 1 ? history.back() : (location.hash = '#/');

// ---------------------------------------------------------------- home
let tab = 'barcode';
function home(msg) {
  ++viewVersion;
  chrome('Crate Digger', false);
  app.innerHTML = `<div class="view">
    <h1 class="large-title">Crate Digger</h1>
    ${msg ? `<div class="banner">${esc(msg)}</div>` : ''}
    <div class="seg" role="tablist">
      <button role="tab" data-t="barcode">Barcode</button>
      <button role="tab" data-t="catno">Cat. No.</button>
      <button role="tab" data-t="q">Artist &amp; Title</button>
    </div>
    <form id="f" autocomplete="off"></form>
    <div id="explore-link"></div>
    <div id="recent"></div>
  </div>`;
  const draw = () => {
    app.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
    const f = $('#f');
    if (tab === 'barcode') f.innerHTML = `
      <button class="btn" type="button" id="scan">${I.camera}Scan Barcode</button>
      <input id="photo" type="file" accept="image/*" capture="environment" class="hidden">
      <p class="hint" id="scanmsg">Hold the barcode flat inside the frame.</p>
      <div class="search">${I.search}<input id="v" type="search" inputmode="numeric" enterkeyhint="search" placeholder="Or type the barcode digits"></div>`;
    else if (tab === 'catno') f.innerHTML = `
      <div class="search">${I.search}<input id="v" type="search" autocapitalize="characters" enterkeyhint="search" placeholder="Catalogue number, e.g. BEWITH020LP"></div>
      <button class="btn" type="submit">Search</button>`;
    else f.innerHTML = `
      <div class="group" style="margin-bottom:12px">
        <div class="field"><label for="a">Artist</label><input id="a" type="text" enterkeyhint="next" placeholder="Ahmad Jamal"></div>
        <div class="field"><label for="v">Album</label><input id="v" type="text" enterkeyhint="search" placeholder="The Awakening"></div>
      </div>
      <button class="btn" type="submit">Search</button>`;
    const photo = $('#photo'); if (photo) photo.onchange = () => decodePhoto(photo.files[0]);
    const scan = $('#scan'); if (scan) scan.onclick = startScan;
  };
  app.querySelectorAll('.seg button').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
  $('#f').onsubmit = e => {
    e.preventDefault();
    const v = $('#v').value.trim(), a = $('#a') ? $('#a').value.trim() : '';
    const text = tab === 'q' ? [a, v].filter(Boolean).join(' ') : v;
    if (text) location.hash = `#/search/${tab}/${encodeURIComponent(text)}`;
  };
  draw();
  drawRecent();
  const current = viewGuard();
  api('/api/explore').then(d => {
    if (!current() || !d.entries?.length) return;
    const el = $('#explore-link');
    if (el) el.innerHTML = `<div class="group"><a class="row" href="#/explore">
      <div class="grow"><div class="t">Explore Later · ${d.entries.length}</div></div>${I.chev}
    </a></div>`;
  }).catch(() => {});
}

function drawRecent() {
  const list = recent(), el = $('#recent');
  el.innerHTML = `
    <div class="section-h" style="margin-top:12px"><h2>Recently Viewed</h2>${list.length ? '<button id="clear">Clear</button>' : ''}</div>
    ${list.length ? `<div class="group" style="--inset:76px">${list.map(r => `
      <a class="row" href="#/release/${r.id}">
        ${r.image ? `<img class="art" src="${esc(r.image)}" alt="">` : `<div class="art"></div>`}
        <div class="grow"><div class="t">${esc(r.title)}</div><div class="s">${esc([r.artist, r.year].filter(Boolean).join(' · '))}</div></div>
        ${I.chev}
      </a>`).join('')}</div>`
    : `<div class="group"><div class="row"><div class="grow s" style="color:var(--label2);font-size:15px">Records you look up will appear here.</div></div></div>`}`;
  const c = $('#clear'); if (c) c.onclick = () => { try { localStorage.removeItem(RECENT); } catch (e) {} drawRecent(); };
}

// Live camera scanning needs HTTPS (or localhost); without it, or without permission, use the photo picker.
let reader = null;
const barcodeReader = () => {
  const hints = new Map();
  const F = ZXing.BarcodeFormat;
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E]);
  return new ZXing.BrowserMultiFormatReader(hints, 250);
};
async function startScan() {
  const msg = $('#scanmsg');
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return $('#photo').click();
  if (!window.ZXing) { msg.textContent = 'The barcode reader is still loading. Try again in a moment.'; return; }
  $('#scanstatus').textContent = 'Point the camera at the barcode';
  $('#scanner').classList.remove('hidden');
  reader = barcodeReader();
  try {
    await reader.decodeFromConstraints({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}},
      $('#scanvideo'), res => {
        if (!res || !reader) return;
        const code = res.getText();
        stopScan();
        location.hash = `#/search/barcode/${encodeURIComponent(code)}`;
      });
  } catch (e) {
    stopScan();
    msg.textContent = e && e.name === 'NotAllowedError'
      ? 'Camera access is off. Allow it in Settings → Safari → Camera, or take a photo instead.'
      : 'The camera could not start. Take a photo of the barcode instead.';
  }
}
function stopScan() {
  if (reader) { reader.reset(); reader = null; }
  $('#scanner').classList.add('hidden');
}
$('#scancancel').onclick = stopScan;
$('#scanphoto').onclick = () => { stopScan(); $('#photo').click(); };

async function decodePhoto(file) {
  if (!file) return;
  const current = viewGuard();
  const msg = $('#scanmsg'); msg.textContent = 'Reading barcode…';
  const url = URL.createObjectURL(file);
  try {
    if (!window.ZXing) throw new Error('the barcode reader did not load');
    const res = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url);
    if (current()) location.hash = `#/search/barcode/${encodeURIComponent(res.getText())}`;
  } catch (e) {
    if (current()) msg.textContent = 'No barcode found. Try again closer, or type the digits.';
  } finally { URL.revokeObjectURL(url); }
}

// ---------------------------------------------------------------- editions
let fmt = 'All';
async function editions(kind, text) {
  ++viewVersion;
  const current = viewGuard();
  chrome('Editions', true);
  app.innerHTML = `<div class="view"><h1 class="large-title">Editions</h1>
    <div class="group"><div class="row">${I.spinner}<div class="grow s">Searching Discogs for “${esc(text)}”</div></div></div></div>`;
  let d;
  try { d = await api(`/api/search?${kind}=${encodeURIComponent(text)}`); }
  catch (e) { if (current()) home(`Search failed: ${e.message}`); return; }
  if (!current()) return;
  const rows = d.results;
  if (rows.length === 1 && !d.note) return location.replace(`#/release/${rows[0].id}`);
  const draw = () => {
    const shown = rows.filter(r => fmt === 'All' || (r.format || '').includes(fmt));
    app.innerHTML = `<div class="view">
      <h1 class="large-title">Editions</h1>
      ${d.note ? `<div class="banner">${esc(d.note)}</div>` : ''}
      ${rows.length ? `<div class="seg" role="tablist">${['All', 'Vinyl', 'CD'].map(f => `<button role="tab" aria-selected="${f === fmt}" data-f="${f}">${f}</button>`).join('')}</div>` : ''}
      <p class="footnote" style="margin:0 0 8px;padding:0 4px">${rows.length ? `${shown.length} of ${rows.length} for “${esc(text)}”` : `Nothing found for “${esc(text)}”. Try the catalogue number, or artist and title.`}</p>
      ${shown.length ? `<div class="group" style="--inset:84px">${shown.map(r => `
        <button class="row" data-id="${r.id}">
          ${r.thumb ? `<img class="art lg" src="${esc(r.thumb)}" alt="" loading="lazy">` : '<div class="art lg"></div>'}
          <div class="grow">
            <div class="t wrap" style="font-size:16px;font-weight:600">${esc(r.title)}</div>
            <div class="s" style="font-size:14px">${esc([r.format, r.year, r.country].filter(Boolean).join(' · '))}</div>
            <div class="s" style="font-size:14px">${esc([r.label, r.catno].filter(Boolean).join(' · '))}</div>
            ${r.owned ? `<span class="pill green" style="margin-top:6px">${I.check}On your shelf</span>` : ''}
          </div>
          ${I.chev}
        </button>`).join('')}</div>` : ''}
    </div>`;
    app.querySelectorAll('.seg button').forEach(b => b.onclick = () => { fmt = b.dataset.f; draw(); });
    app.querySelectorAll('button.row').forEach(b => b.onclick = () => location.hash = `#/release/${b.dataset.id}`);
  };
  draw();
}

// ---------------------------------------------------------------- record card
const sk = (n, h = '') => `<div class="row"><div class="grow">${Array.from({length: n}, (_, i) => `<div class="skel" style="width:${88 - i * 22}%;${h}"></div>`).join('')}</div></div>`;

function ownership(o) {
  const row = (cls, icon, t, s) => `<div class="row"><div class="ico ${cls}">${icon}</div><div class="grow"><div class="t wrap" style="font-weight:600">${t}</div>${s ? `<div class="s wrap">${esc(s)}</div>` : ''}</div></div>`;
  if (!o) return row('gray', I.minus, 'Not on your shelf or in your library', '');
  if (o.kind === 'same') return row('tint', I.check, 'You own this', [o.format, o.year, o.reissue ? 'Reissue' : ''].filter(Boolean).join(' · '));
  if (o.kind === 'other_edition') return row('orange', I.stack, 'You own a different release', [o.format, o.year, o.country, o.label].filter(Boolean).join(' · '));
  return row('blue', I.note, 'In your Apple Music library', `Not on your shelf · ${plural(o.plays, 'play')} · ${o.liked} liked`);
}

function connections(links) {
  const rows = [];
  for (const kind of ['artists', 'musicians', 'producers', 'labels']) {
    for (const entry of links?.[kind] || []) {
      const title = kind === 'artists' ? `More by ${entry.name}` : kind === 'producers' ? `Produced by ${entry.name}`
        : kind === 'musicians' && entry.role ? `${entry.name} · ${entry.role}` : entry.name;
      const records = entry.records.map(r => `<a href="#/release/${esc(encodeURIComponent(r.id))}">${esc(r.title)}</a>`).join(', ');
      const extra = entry.count > entry.records.length ? ` and ${esc(entry.count - entry.records.length)} more` : '';
      const first = entry.records[0];
      const subtitle = kind === 'artists' && entry.count === 1 && first
        ? `${records}${first.year != null && first.year !== '' ? ` (${esc(first.year)})` : ''}`
        : kind === 'artists' || kind === 'labels' ? `${esc(plural(entry.count, 'record'))} you own: ${records}${extra}`
        : entry.count === 1 && first ? `on ${records} (${esc([first.artist, first.year].filter(v => v != null && v !== '').join(', '))})`
        : `on ${esc(plural(entry.count, 'record'))}: ${records}${extra}`;
      const icon = kind === 'labels' ? I.disc : kind === 'producers' ? I.stack : I.note;
      rows.push(`<div class="row"><div class="ico blue" aria-hidden="true">${icon}</div><div class="grow">
        <div class="t wrap" style="font-weight:600">${esc(title)}</div><div class="s wrap">${subtitle}</div></div></div>`);
    }
  }
  return rows.length ? `<div class="section-h"><h2>Connections on Your Shelf</h2></div>
    <div class="group" style="--inset:58px">${rows.join('')}</div>` : '';
}

const tagsHTML = (style, decade, how) => style
  ? `<span class="pill tint">${esc(style)}</span>${decade ? `<span class="pill">${esc(decade)}</span>` : ''}<span class="pill">${esc(how)}</span>`
  : `<span class="pill">Style not clear from Discogs</span>`;

async function card(id) {
  ++viewVersion;
  const current = viewGuard();
  chrome('', true);
  app.innerHTML = `<div class="view">
    <div class="hero" id="hero"><div class="ph"></div><div class="skel" style="width:55%;height:18px;margin:0 auto 8px"></div><div class="skel" style="width:40%;height:16px;margin:0 auto"></div></div>
    <div class="group" id="own">${sk(1)}</div>
    <div id="connections"></div>
    <div class="section-h"><h2>Closest in Your Collection</h2></div>
    <div class="group" id="picks">${sk(2)}${sk(2)}</div>
    <div class="section-h"><h2>Listen</h2></div>
    <div class="group" id="listen" style="--inset:62px">${sk(1)}${sk(1)}${sk(1)}</div>
    <div class="chips" id="links"></div>
    <div class="section-h"><h2>Price &amp; Market</h2></div>
    <div class="group" id="price">${sk(2)}</div>
    <div id="decide"></div>
    <p class="attrib" id="attrib"></p>
  </div>`;
  let r;
  try { r = await api(`/api/release/${id}`); }
  catch (e) { if (!current()) return; app.innerHTML = `<div class="view"><div class="banner">Could not load this release: ${esc(e.message)}</div><a class="btn" href="#/">New Search</a></div>`; return; }
  if (!current()) return;
  remember(r);
  chrome(r.title, true);

  $('#hero').innerHTML = `
    ${r.live ? '' : '<div class="banner">Discogs did not answer, so this is the copy saved on your computer.</div>'}
    ${r.image ? `<img src="${esc(r.image)}" alt="Cover of ${esc(r.title)}">` : '<div class="ph"></div>'}
    <h1>${esc(r.title)}</h1>
    <p class="artist">${esc(r.artist)}</p>
    <p class="meta">${esc([r.format, r.year, r.country].filter(Boolean).join(' · '))}</p>
    <p class="meta" style="text-transform:none;font-weight:400;margin-top:2px">${esc([r.label, r.catno].filter(Boolean).join(' · '))}</p>
    <div class="tags" id="tags">${tagsHTML(r.style, r.decade, 'Discogs')}</div>`;
  $('#own').innerHTML = ownership(r.own);
  $('#connections').innerHTML = connections(r.links);
  $('#attrib').innerHTML = `Data provided by <a href="${esc(r.uri)}" target="_blank" rel="noopener">Discogs</a>`;

  const m = r.market;
  $('#price').innerHTML = `
    <div class="price">${m.low != null ? `<b>A$${Number(m.low).toFixed(2)}</b><small>Lowest listed for this edition · any condition, plus shipping</small>`
                                        : '<b style="font-size:17px;font-weight:600">No copies for sale</b>'}</div>
    <div class="stats">
      <div><b>${m.have ?? '–'}</b><small>Own it</small></div>
      <div><b>${m.want ?? '–'}</b><small>Want it</small></div>
      <div><b>${m.for_sale ?? '–'}</b><small>For sale</small></div>
    </div>`;
  decisions(id, r, current);

  loadPicks(id, r, current);
  loadSamples(id, current);
}

async function loadPicks(id, r, current) {
  const el = $('#picks');
  el.innerHTML = `<div class="row">${I.spinner}<div class="grow s">Finding the closest records…</div></div>${sk(2)}`;
  let x;
  try { x = await api(`/api/recommend/${id}`, {method: 'POST'}); }
  catch (e) { x = {status: 'unavailable: ' + e.message}; }
  if (!current()) return;
  if (!x.result) {
    el.innerHTML = `<div class="row"><div class="ico gray">${I.minus}</div><div class="grow"><div class="t">Recommendations unavailable</div>
      <div class="s wrap">${esc(x.status.replace(/^unavailable: /, ''))}</div></div></div>`;
    return;
  }
  const res = x.result;
  if (res.style !== 'Other/uncertain') $('#tags').innerHTML = tagsHTML(res.style, r.decade, 'Model');
  el.style.setProperty('--inset', '58px');
  el.innerHTML = `<div class="sentence">${esc(res.sentence)}</div>
    ${res.picks.length ? res.picks.map(p => `
      <div class="row" style="align-items:flex-start">
        <div class="ico ${p.where === 'shelf' ? 'tint' : 'blue'}" style="margin-top:2px">${p.where === 'shelf' ? I.disc : I.note}</div>
        <div class="grow">
          <div class="t wrap" style="font-size:16px;font-weight:600">${esc(p.name)}</div>
          <div class="s wrap" style="margin:2px 0 6px">${esc(p.reason)}</div>
          ${p.where === 'shelf' ? '<span class="pill tint">On your shelf</span>'
                                : `<span class="pill blue">Library · ${plural(p.plays, 'play')} · ${p.liked} liked</span>`}
        </div>
      </div>`).join('')
    : `<div class="row"><div class="grow s wrap">Nothing close in your collection or library.</div></div>`}`;
  const foot = document.createElement('p');
  foot.className = 'footnote'; foot.style.marginTop = '-18px';
  foot.textContent = x.saved ? `Saved answer from ${x.at} · no new cost` : `${x.seconds} s${x.attempts > 1 ? ` · ${x.attempts} attempts` : ''}${x.cost ? ` · US$${x.cost.toFixed(4)}` : ''}`;
  el.after(foot);
}

async function loadSamples(id, current) {
  const el = $('#listen');
  let s;
  try { s = await api(`/api/samples/${id}`); } catch (e) { s = {tracks: [], videos: [], error: e.message}; }
  if (!current()) return;
  el.innerHTML = s.tracks.length ? s.tracks.map((t, i) => `
    <div class="row">
      <span class="num">${i + 1}</span>
      <div class="grow"><div class="t">${esc(t.name)}</div></div>
      <button class="play" aria-label="Play ${esc(t.name)}">${I.play}</button>
      <audio preload="none" src="${esc(t.preview)}"></audio>
    </div>`).join('')
    : `<div class="row"><div class="grow s">No Apple Music previews for this album.</div></div>`;
  $('#links').innerHTML = [
    s.apple_url && `<a class="chip" href="${esc(s.apple_url)}" target="_blank" rel="noopener">${I.note}Apple Music</a>`,
    ...(s.videos || []).slice(0, 1).map(v => `<a class="chip" href="${esc(v[0])}" target="_blank" rel="noopener">${I.play}Discogs video</a>`),
    s.youtube && `<a class="chip" href="${esc(s.youtube)}" target="_blank" rel="noopener">${I.search}YouTube</a>`,
  ].filter(Boolean).join('');
  const reset = b => b.innerHTML = I.play;
  el.querySelectorAll('.play').forEach(b => b.onclick = () => {
    const a = b.nextElementSibling;
    el.querySelectorAll('audio').forEach(o => { if (o !== a && !o.paused) { o.pause(); reset(o.previousElementSibling); } });
    if (a.paused) { a.play(); b.innerHTML = I.pause; } else { a.pause(); reset(b); }
    a.onended = () => reset(b);
  });
}

// ---------------------------------------------------------------- decisions (the dig history, saved on the server)
const DONE = {buy: 'Bought on', pass: 'Passed on', explore: 'Saved to explore on', wishlist: 'Wishlisted on'};
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dayOf = iso => { const [, m, d] = iso.slice(0, 10).split('-').map(Number); return `${d} ${MONTHS[m - 1]}`; };
const JSON_TYPE = {'Content-Type': 'application/json'};

async function explore() {
  ++viewVersion;
  chrome('Explore Later', true);
  app.innerHTML = '<div class="view"><h1 class="large-title">Explore Later</h1><div id="explore-list"></div></div>';
  const current = viewGuard();
  try {
    const d = await api('/api/explore');
    if (!current()) return;
    const entries = d.entries || [];
    $('#explore-list').innerHTML = entries.length ? `<div class="group">${entries.map(e => `
      <a class="row" href="#/release/${esc(encodeURIComponent(e.release_id))}">
        <div class="grow">
          <div class="t wrap"><b>${esc(e.artist)}</b> · ${esc(e.title)}</div>
          ${e.note ? `<div class="s wrap">${esc(e.note)}</div>` : ''}
          ${e.tracks?.length ? `<div class="s wrap">${e.tracks.map(esc).join(' · ')}</div>` : ''}
          <div class="s">${esc(dayOf(e.date))}</div>
        </div>${I.chev}
      </a>`).join('')}</div>`
      : '<div class="group"><div class="row"><div class="grow s wrap">Nothing saved yet. Tap Explore later on a record card.</div></div></div>';
  } catch (e) {
    if (current()) $('#explore-list').innerHTML = `<div class="banner">Could not load Explore Later: ${esc(e.message)}</div>`;
  }
}

function decisions(id, r, current, {error = '', price = ''} = {}) {
  const el = $('#decide'), d = r.decision;
  const banner = error ? `<div class="banner">${esc(error)}</div>` : '';
  const send = (action, busy, extra = {}) => {
    const sticker = $('#sticker').value.trim() || null;
    return act(id, r, current, busy, `/api/decision/${id}`, {method: 'POST', headers: JSON_TYPE,
      body: JSON.stringify({action, price: sticker, ...extra})}, sticker || '');
  };
  const choices = (withBanner = true) => `${withBanner ? banner : ''}
    <div class="group"><div class="field"><label for="sticker">Price</label>
      <input id="sticker" type="text" inputmode="decimal" placeholder="Sticker price, optional" value="${esc(price)}"></div></div>
    <div class="decide">
      ${r.own?.kind === 'same' ? '' : '<button class="dbtn buy" id="buy">Buy</button>'}
      ${d?.action === 'explore' || d?.action === 'pass' ? '' : '<button class="dbtn explore" id="explore">Explore later</button>'}
      ${r.wanted ? '' : '<button class="dbtn want" id="wishlist">Wishlist</button>'}
    </div>
    ${d?.action === 'explore' || d?.action === 'pass' ? '' : '<div id="exploreform"></div>'}`;
  const wireChoices = () => {
    const buy = $('#buy'), wishlist = $('#wishlist');
    if (buy) buy.onclick = () => send('buy', 'Adding to your collection…');
    if (wishlist) wishlist.onclick = () => send('wishlist', 'Adding to your wantlist…');
    const explore = $('#explore');
    if (!explore) return;
    explore.onclick = () => {
      const form = $('#exploreform');
      if (form.innerHTML) { form.innerHTML = ''; return; }
      const tracks = r.tracks || [];
      form.innerHTML = `<div class="group" style="--inset:58px; margin-top:12px">
          <div class="field"><label for="note">Note</label><input id="note" type="text" placeholder="Why it is worth a listen"></div>
          ${tracks.map((t, i) => `<label class="row"><input type="checkbox" id="tr-${i}"><span class="t wrap">${esc(t)}</span></label>`).join('')}
        </div>
        <button class="btn" id="save">Save</button>`;
      $('#save').onclick = () => send('explore', 'Saving…', {
        note: $('#note').value.trim(), tracks: tracks.filter((_, i) => $('#tr-' + i).checked)});
    };
  };
  if (d) {
    el.innerHTML = `${banner}<div class="group"><div class="row"><div class="grow t">${esc(DONE[d.action])} ${esc(dayOf(d.date))}</div>
      <button class="textbtn" id="undo">Undo</button></div></div>`;
    if (d.action === 'explore' || d.action === 'pass') {
      el.innerHTML += choices(false);
      wireChoices();
    }
    $('#undo').onclick = () => act(id, r, current, 'Undoing…', `/api/decision/${d.id}`, {method: 'DELETE', headers: JSON_TYPE});
    return;
  }
  el.innerHTML = choices();
  wireChoices();
}

// A late answer may only change the card that sent it.
async function act(id, r, current, busy, path, opts, price = '') {
  $('#decide').innerHTML = `<div class="group"><div class="row">${I.spinner}<div class="grow s">${esc(busy)}</div></div></div>`;
  let result;
  try {
    result = await api(path, opts);
    if (!current()) return;
    if (opts.method === 'DELETE') {
      const latest = await api(`/api/release/${id}`);
      if (!current()) return;
      r.decision = latest.decision;
    } else r.decision = result.decision;
  }
  catch (e) { if (current()) decisions(id, r, current, {error: e.message, price}); return; }
  if (current()) decisions(id, r, current);
}

// ---------------------------------------------------------------- routing
function route() {
  const [, view, a, b] = location.hash.split('/');
  stopScan();
  window.scrollTo(0, 0);
  if (view === 'search') return editions(a, decodeURIComponent(b || ''));
  if (view === 'release') return card(a);
  if (view === 'explore') return explore();
  home();
}
window.addEventListener('hashchange', route);
$('#refresh').onclick = async e => {
  const b = e.currentTarget; b.disabled = true; b.style.opacity = .4;
  home('Refreshing… new records take a couple of seconds each to download.');
  const current = viewGuard();
  try {
    const d = await api('/api/refresh', {method: 'POST'});
    if (current()) home(`Refreshed: ${d.shelf} shelf records, ${d.library} library albums` +
      (d.added ? `; ${d.added} new record${d.added > 1 ? 's' : ''} downloaded` : '') +
      (d.failed.length ? `. Could not download ${d.failed.join(', ')}; Refresh again to retry.` : '.'));
  }
  catch (err) { if (current()) home(`Refresh failed: ${err.message}`); }
  b.disabled = false; b.style.opacity = '';
};
route();
</script>
